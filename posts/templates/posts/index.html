<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echo | Community Board</title>
</head>
<body>
    <h1>Echo Community Board</h1>
    <p>Welcome to the conversation. Here are the latest topics:</p>
    
    <ul>
        {% for topic in topics %}
            <li>
                <h3>{{ topic.title }}</h3>
                <p>{{ topic.content }}</p>
            </li>
        {% empty %}
            <li>No topics have been posted yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
