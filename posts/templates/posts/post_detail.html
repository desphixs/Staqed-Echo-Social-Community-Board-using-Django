<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} | Echo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">

    <!-- Simple Modern Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <nav class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight text-indigo-600">Echo</a>
            <div class="flex gap-6 text-sm font-medium text-slate-600">
                <a href="/" class="hover:text-indigo-600 transition-colors">Feed</a>
                <a href="{% url 'create_post' %}" class="hover:text-indigo-600 transition-colors">Create Post</a>
            </div>
        </nav>
    </header>

    <main class="max-w-3xl mx-auto px-6 py-12">
        <!-- Back Button -->
        <a href="/"
            class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors mb-8">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
                </path>
            </svg>
            Back to Feed
        </a>

        <!-- Post Content -->
        <article class="bg-white border border-slate-200 p-10 rounded-3xl shadow-sm">
            <header class="mb-8">
                <h1 class="text-4xl font-bold tracking-tight text-slate-900 leading-tight">
                    {{ post.title }}
                </h1>
                <div class="flex items-center gap-3 mt-4 text-sm font-medium">
                    <div class="mr-auto flex items-center gap-2 text-slate-400">
                        <span>By <span class="text-slate-600 font-semibold">{{ post.author.username|default:"Anonymous" }}</span></span>
                        <span class="text-slate-300">•</span>
                        <span>{{ post.created_at|date:"F j, Y" }}</span>
                    </div>
                    {% if post.author == user %}
                        <a href="{% url 'edit_post' post.id %}" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg hover:bg-indigo-50 hover:text-indigo-600 transition-all">
                            Edit
                        </a>
                        <a href="{% url 'delete_post' post.id %}" class="px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition-all">
                            Delete
                        </a>
                    {% endif %}
                </div>
            </header>

            <div class="prose prose-slate max-w-none text-slate-600 leading-loose text-lg">
                {{ post.content|linebreaks }}
            </div>
        </article>
    </main>

</body>

</html>
