<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Post | Echo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-white border border-slate-200 p-10 rounded-3xl shadow-xl text-center">
        <!-- Warning Icon -->
        <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>

        <h1 class="text-2xl font-bold tracking-tight text-slate-900 mb-2">Delete this post?</h1>
        <p class="text-slate-500 mb-8 leading-relaxed">
            Are you sure you want to delete <span class="font-semibold text-slate-800">"{{ post.title }}"</span>? This action cannot be undone.
        </p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg shadow-red-200 active:scale-[0.98]">
                Yes, delete permanently
            </button>
            <a href="{% url 'post_detail' post.pk %}" class="block w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-4 px-6 rounded-xl transition-all">
                No, take me back
            </a>
        </form>
    </div>

</body>
</html>
