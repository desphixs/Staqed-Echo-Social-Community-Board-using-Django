<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post | Echo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <nav class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold tracking-tight text-indigo-600">Echo</a>
            <div class="flex gap-6 text-sm font-medium text-slate-600">
                <a href="/" class="hover:text-indigo-600 transition-colors">Feed</a>
                <a href="{% url 'create_post' %}" class="text-indigo-600">Create Post</a>
            </div>
        </nav>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-12">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-slate-900">Start a Conversation</h1>
            <p class="mt-2 text-slate-500">Share your thoughts with the community.</p>
        </div>

        <form method="POST" class="space-y-8 bg-white p-8 md:p-10 rounded-3xl border border-slate-200 shadow-sm">
            {% csrf_token %}
            
            <div class="space-y-6">
                {% for field in form %}
                <div class="space-y-2">
                    <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-slate-700 ml-1">
                        {{ field.label }}
                    </label>
                    {{ field }}
                    {% if field.errors %}
                        <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
                {% endfor %}
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-xl transition-all shadow-lg shadow-indigo-200 active:scale-[0.98]">
                    Publish Post
                </button>
                <a href="/" class="block text-center mt-6 text-sm font-medium text-slate-400 hover:text-slate-600 transition-colors">
                    Cancel and go back
                </a>
            </div>
        </form>
    </main>

</body>
</html>
