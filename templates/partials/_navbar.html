<!-- _navbar.html -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <nav class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
        <a href="/" class="text-xl font-bold tracking-tight text-indigo-600">Echo</a>
        <div class="flex gap-6 text-sm font-medium items-center text-slate-600">
            <a href="/" class="hover:text-indigo-600 transition-colors">Feed</a>
            <a href="{% url 'create_post' %}" class="hover:text-indigo-600 transition-colors">Create Post</a>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="hover:text-indigo-600 transition-colors">Dashboard</a>
                <a href="{% url 'signout' %}" class="hover:text-indigo-600 transition-colors text-red-500">Logout</a>
                
                <!-- Small Avatar -->
                <a href="{% url 'profile-edit' %}" class="ml-2">
                    {% if user.profile_pic %}
                        <img src="{{ user.profile_pic.url }}" alt="Avatar" class="w-8 h-8 rounded-full object-cover border border-slate-100">
                    {% else %}
                        <div class="w-8 h-8 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold text-[10px]">
                            {{ user.username|slice:":1"|upper }}
                        </div>
                    {% endif %}
                </a>
            {% else %}
                <a href="{% url 'signin' %}" class="hover:text-indigo-600 transition-colors">Sign In</a>
                <a href="{% url 'signup' %}" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition-all">Sign Up</a>
            {% endif %}
        </div>
    </nav>
</header>
