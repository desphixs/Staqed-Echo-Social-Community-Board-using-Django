<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard | Echo{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex">

    <!-- Sidebar Layout -->
    <aside class="w-64 bg-white border-r border-slate-200 h-screen sticky top-0 flex flex-col p-6 shrink-0">
        <a href="/" class="text-2xl font-bold tracking-tight text-indigo-600 mb-10">Echo</a>
        
        <nav class="flex-1 space-y-2">
            <a href="/" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition-all font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                Feed
            </a>
            <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-3 bg-indigo-50 text-indigo-600 rounded-xl transition-all font-bold">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                Dashboard
            </a>
            <a href="{% url 'profile-edit' %}" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 rounded-xl transition-all font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                Profile
            </a>
        </nav>

        <div class="mt-auto pt-6 border-t border-slate-100">
            <div class="flex items-center gap-3 mb-6 px-2">
                {% if user.profile_pic %}
                    <img src="{{ user.profile_pic.url }}" alt="Avatar" class="w-10 h-10 rounded-full object-cover">
                {% else %}
                    <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold">
                        {{ user.username|slice:":1"|upper }}
                    </div>
                {% endif %}
                <div class="truncate">
                    <p class="text-sm font-bold text-slate-900 truncate">{{ user.username }}</p>
                    <p class="text-xs text-slate-500 truncate">{{ user.email }}</p>
                </div>
            </div>
            <a href="{% url 'signout' %}" class="flex items-center gap-3 px-4 py-3 text-red-500 hover:bg-red-50 rounded-xl transition-all font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                Logout
            </a>
        </div>
    </aside>

    <!-- Dashboard Content Area -->
    <main class="flex-1 p-10 overflow-y-auto">
        {% block content %}{% endblock %}
    </main>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
